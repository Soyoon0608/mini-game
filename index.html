<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>장애물 피하기</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>장애물 피하기</h1>

        <p>← → 방향키로 플레이어를 움직이세요!</p>
        <p>20초 동안 장애물을 피하면 성공합니다.</p>

        <div id="game">
            <div id="player"></div>
            <div id="obstacle"></div>
        </div>

        <div id="status">게임 준비</div>

        <button id="startButton">게임 시작</button>

        <p>실패 후 R 키를 누르면 다시 시작할 수 있습니다.</p>

    </div>

    <script src="game.js"></script>

</body>
</html>
